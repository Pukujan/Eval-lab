id: EXP-20260924-029-consolidated-judge-analysis
status: completed
hypothesis: On identical typed decisions with objective gold labels, independent judges differ in coverage as well as accuracy, and accuracy computed only over answered records misranks judges whose unresolved share is large.
created_at: 2026-09-24
code_commit: 0b996a5d0b4557b65692e3c697cda5045d2d06f9
code_commit_note: commit whose scripts/analyze_judge_comparison.py last regenerated results.json (TASK-0058). The original value 51256cb predated the TASK-0056/0057/0058 regenerations and was corrected in TASK-0059; tests/test_chart_data_export.py checks that results.json at code_commit is byte-identical to the committed file.
results_sha256: 5e1e831a0827a9735696405ce75f62fe58a696e8be96f6353ed5ba01af56a228
seed: none (deterministic offline analysis; no sampling)
analysis_type: offline re-analysis of committed prediction files; no model or provider calls
dataset:
  name: EXP-014/EXP-015 matched pool, blind partition (inherited unchanged by EXP-016/019/022/024/025/027)
  count: 760
  modes: {single: 652, pairwise: 108}
  split_policy: blind comparison records only; public-selection records are not scored here
research_question: When independent judges, from small local models to frontier APIs, receive identical typed decisions with objective gold labels, how do their accuracy and coverage differ, and what does accuracy-only reporting hide?
arms:
  count: 25
  reference: majority-label reference (fail for single, B for pairwise)
  sources: [EXP-013, EXP-014, EXP-015, EXP-016, EXP-017, EXP-022, EXP-024, EXP-025, EXP-027]
  not_run: [MiMo V2.5 (HTTP 402), Bespoke Nimble-9B (host memory), Kev-9B (host memory)]
  excluded: [Luna (EXP-019 vendor-independent policy)]
metrics:
  - coverage (resolved / 760)
  - conditional_accuracy (correct / resolved)
  - all_record_accuracy (correct / 760)
  - 95% Wilson score intervals
  - unresolved status breakdown
  - per-mode and per-source accuracy
  - exact two-sided McNemar on shared resolved records and on all 760, Holm-corrected over 325 pairs
  - median resolved latency and median completion tokens when recorded
script: scripts/analyze_judge_comparison.py
artifacts:
  - README.md
  - experiment.yaml
  - results.json
  - report.md
notes: Source prediction files are fingerprinted in results.json with LF-normalized SHA-256. Completed experiments are read only and unchanged. EXP-027 local arms use a different (native label scoring) harness on the same records.
