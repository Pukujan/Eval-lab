id: EXP-20260920-009-selective-escalation
status: planned
hypothesis: >
  Calibrated confidence from the frozen TASK-0009 student identifies a lower-risk
  subset that can be handled locally, reducing external-model usage under selective
  escalation relative to strong-judge-only operation.
created_at: 2026-09-20
code_commit: null
seed: 20260920
context_limit: 4096
benchmark:
  name: EvalLab-Select
  version: 0.1.0
  fingerprint: null
dataset:
  sources:
    - synthetic-objective
    - allenai/ai2_arc:ARC-Challenge
  split_policy: >
    Threshold selection uses only non-final records. Final evaluation labels remain
    frozen until thresholds, provider arms, and typed specification are frozen.
student:
  source_task: TASK-0009
  model_family: tfidf-logistic-regression
  selected_arm: D
providers:
  jev:
    provider: openrouter
    pinned_model: typesafe/jev-1.13
    canary_model: ~typesafe/jev-latest
  qwen_flash:
    provider: yolo-auto
    model: qwen3.8-flash
policies:
  - local_only
  - jev_only
  - qwen_flash_only
  - calibrated_local_to_jev
  - raw_local_to_jev
  - random_matched_to_jev
  - calibrated_local_to_qwen_flash
  - system_one_differential
target_error_rates: [0.01, 0.02, 0.05, 0.10]
statistical_reporting:
  confidence_level: 0.95
  low_error_claim_rule: upper-bound-must-meet-target
research_artifact:
  ro_crate: "1.3"
  provenance: "W3C PROV-O"
  validation: "W3C SHACL Recommendation 2017"
  citation: "CFF 1.2.0"
  datacite_compatibility: "4.6"
artifacts:
  routing: routing.jsonl
  thresholds: thresholds.json
  results: results.json
  report: report.md
  provenance: provenance.ttl
  crate: ro-crate-metadata.json
notes:
  - Final thresholds and fingerprints must be committed before final evaluation.
