id: EXP-20260921-014-independent-jev-benchmark
status: completed
hypothesis: Jev will be competitive on objective typed decisions but show dataset-dependent calibration and perturbation behavior.
created_at: 2026-09-21
code_commit: 108a80eb761b8f5f87374b881fa4711a37c319d6
seed: 20260921
context_limit: 4096
dataset:
  name: independent Eval Lab objective pool
  version: EXP-20260921-014 independent source freeze
  fingerprint: b7edd61269f0f7757e734bc7e3f665ac2bcd6d908a1e56f73f0b0291d55b64d8
  split_policy: source-problem disjoint public selection and blind holdout
judge:
  provider: openrouter
  model: typesafe/jev-1.13 and ~typesafe/jev-latest
  adapter_version: eval-lab-system-one-v0.1.0
  prompt_version: typed-question-spec-0.1.0
rubric:
  version: eval-lab-system-one-v0.1.0
gold:
  provenance_policy: answer_key_or_deterministic_verifier_only
