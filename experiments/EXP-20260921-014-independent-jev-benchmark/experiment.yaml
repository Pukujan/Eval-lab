  - nll_when_native_probabilities_available
  - ece_when_native_probabilities_available
  - option_order_consistency
  - rubric_paraphrase_consistency
  - repeatability
  - latency_p95
  - actual_cost
artifacts:
  - README.md
  - PLAN.md
  - experiment.yaml
  - source-manifest.json (after freeze)
  - splits.json (after freeze)
  - checksums.sha256 (after freeze)
  - predictions.jsonl (after live run)
  - results.json (after live run)
  - report.md (after live run)
notes: Source and typed protocol frozen before live labels. Pinned primary evaluation and the pre-frozen robustness subset are complete; rolling is a separately stopped canary. JevBench is contextual external evidence and is excluded from the primary independent score. Pinned and rolling Jev are separate arms.
