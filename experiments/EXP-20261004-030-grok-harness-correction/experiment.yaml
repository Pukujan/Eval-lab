notes: >-
  Append-only correction. EXP-022 and EXP-025 are not modified. The only change
  from EXP-022 is the provider invocation: the prompt is written to a unique
  per-record temp file and passed as `--prompt-file`, because a two-line prompt
  embedded in argv is truncated by the Windows grok.CMD shim at the newline.
  Records, gold labels, model aliases, schema, route, and timeout are identical.
