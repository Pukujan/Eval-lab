id: EXP-20261004-030-grok-harness-correction
status: completed
hypothesis: >-
  The Grok Build scores recorded in EXP-022 and EXP-025 are an artifact of a
  Windows invocation defect, not a model or protocol limitation. Delivering the
  prompt through a per-record prompt file instead of an inline
  `--single=<prompt>` argv element (which cmd.exe truncates at the embedded
  newline) will recover near-ceiling single- and pairwise-mode accuracy for
  Grok 4.6 and Grok 4.7 on the same frozen EXP-015 records.
created_at: 2026-10-04
code_commit: pending_task_checkpoint
seed: 0
context_limit: 4096
supersedes:
  - id: EXP-20260921-015-grok-luna-qwen-bakeoff
    reason: >-
      The EXP-015 Grok arm used the same argv invocation, so its Grok result is
      void. Only the Grok arm is re-run here; the Qwen and Luna arms of EXP-015
      are unaffected and remain authoritative.
  - id: EXP-20260922-022-fast-provider-wave
    reason: >-
      EXP-022's Grok 4.6 and Grok 4.7 arms used the same argv invocation, so
      their Grok results are void. Only the Grok arms are re-run here; the Qwen
      and Jev arms of EXP-022 are unaffected.
  - id: EXP-20260922-025-grok-protocol-ablation
    reason: >-
      EXP-025 used the same argv invocation and inherits the truncation defect;
      its "protocol-specific underperformance" conclusion is void.
dataset:
  name: EXP-015 immutable typed objective pool
  version: EXP-015
  fingerprint: b7edd61269f0f7757e734bc7e3f665ac2bcd6d908a1e56f73f0b0291d55b64d8
  split_policy: identical frozen public_selection and blind_holdout partitions
judge:
  provider: xai-grok-build-cli
  model: grok-4.6; grok-4.7
  adapter_version: grok-harness-correction-v1
  prompt_version: unchanged EXP-022 typed-schema prompt, delivered via --prompt-file
rubric:
