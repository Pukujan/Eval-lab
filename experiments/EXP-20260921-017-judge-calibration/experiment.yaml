id: EXP-20260921-017-judge-calibration
status: completed
hypothesis: Local Qwen 4B forced-choice probabilities will become more reliable after temperature scaling fit only on public calibration records, improving held-out probability metrics and selective-risk behavior.
created_at: 2026-09-21
plan_baseline_commit: f446271c7cdb94ba19aa491de2e135705651d5fb
seed: 20260921
context_limit: 2048
dataset:
  name: exact EXP-015 matched pool inherited from EXP-014
  version: EXP-20260921-017 frozen source reference
  fingerprint: b7edd61269f0f7757e734bc7e3f665ac2bcd6d908a1e56f73f0b0291d55b64d8
  blind_record_ids_fingerprint: 409428fc71b447d0114dd7a1929cbed34269a4318ef249c108582b70069d8d61
  count: 1408
  split_policy: source-problem-disjoint public calibration and blind evaluation; blind remains untouched during fitting
typed_protocol:
  spec_id: eval-lab-system-one
  spec_version: 0.1.0
  fingerprint: 0d07bd8b8b60bd7f0b5b7a5f5819b7d329ea121f686b240e465695b6f6eca1e4
  legal_single_labels: [pass, fail]
  legal_pairwise_labels: [A, B, TIE]
judge:
  provider: local
  model: Qwen/Qwen3-4B
  adapter_version: qwen-forced-choice-v3-4bit
  prompt_version: eval-lab-system-one-local-v1
  score_semantics: conditional log-likelihood of legal label continuation followed by softmax
  quantization: 4bit-nf4-double-quant
  compute_dtype: float16
  gpu_memory_fraction: 0.8
calibration:
  method: scalar temperature scaling fit separately by judgment mode
  split: public_selection_only
  blind_labels_used_for_fit: false
  external_label_only_arms_calibrated: false
metrics:
  - accuracy
  - balanced_accuracy
  - macro_f1
  - brier_raw_and_calibrated
  - nll_raw_and_calibrated
  - ece_raw_and_calibrated
  - risk_coverage_raw_and_calibrated
  - coverage_at_target_error
  - wilson_95_accuracy_interval
  - latency_p50
  - latency_p95
  - provider_and_runtime_status_counts
  - same_record_agreement
artifacts:
  - PLAN.md
  - README.md
  - experiment.yaml
  - local-runtime.json
  - calibration/
  - runs/
  - results.json
  - report.md
  - reference-comparison.json
  - checksums.sha256
notes: EXP-015 and EXP-014 remain immutable. The 4B local arm uses bitsandbytes NF4 double quantization with float16 compute to fit the 8 GiB RTX 4060; the frozen prompts have a measured maximum of 755 input tokens, so the 2048-token cap preserves the full pool. Direct Grok Build, Luna, remote Qwen Flash, and pinned Jev are offline label-only references; no OpenCode or OpenRouter calls are permitted in TASK-0017. The separate Jev-only EXP-018 may use OpenRouter.
