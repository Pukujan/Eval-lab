# Structured judge-arm metadata for scripts/export_chart_data.py (TASK-0059).
#
# One entry per arm key in scripts/analyze_judge_comparison.py ARMS. These fields
# were free text in each arm's `harness` string; here they are structured, and
# each one cites the committed file that records it (`evidence`).
# tests/test_chart_data_export.py checks that:
#   * the keys match the EXP-029 arms exactly,
#   * every evidence path exists,
#   * settings agree with the harness text and with the per-prediction
#     provider_metadata (max_tokens, context_cap, model id) wherever that exists.
#
# Field meanings:
#   short_label: display label without the experiment suffix (the experiment is
#     its own field).
#   model_family: vendor/model family used as a filter dimension.
#   model_id: model identifier as recorded in the predictions (judge_id).
#   params_b: parameter count in billions, only when public (else null).
#   settings.max_output_tokens: output-token cap sent with the request; null when
#     not sent.
#   settings.max_output_tokens_status: set | provider_default | not_applicable.
#   settings.context_cap_tokens: input truncation cap for local scorers; null if none.
#   settings.thinking: off (explicitly disabled) | provider_default (no flag sent)
#     | not_applicable (scoring models and baselines that do not generate text).
#   settings.decoding: generative_label | label_log_likelihood | native_label_head
#     | constant.
#   settings.temperature: when recorded in the request; null otherwise.
