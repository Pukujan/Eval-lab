name: Fix Experiment 1 lint

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/experiment-1-public-evaluation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experiment-1-public-evaluation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.14.14

      - name: Apply deterministic lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          evaluator = Path('app/evaluator/experiment_one.py')
          text = evaluator.read_text(encoding='utf-8')
          text = text.replace(
              'from app.intake.bundle import IntakeBundle, IntakeRejected, intake_submission\n',
              'from app.intake.bundle import (\n'
              '    IntakeBundle,\n'
              '    IntakeRejected,\n'
              '    intake_submission,\n'
              ')\n',
          )
          text = text.replace(
              '            "Schema, manifest, artifact, lineage, report, redaction, and model-audit checks passed.",\n',
              '            (\n'
              '                "Schema, manifest, artifact, lineage, report, redaction, "\n'
              '                "and model-audit checks passed."\n'
              '            ),\n',
          )
          text = text.replace(
              '                f"client_retries={audit[\'client_retry_count\']}, redirects={audit[\'redirects_followed\']}"\n',
              '                f"client_retries={audit[\'client_retry_count\']}, "\n'
              '                f"redirects={audit[\'redirects_followed\']}"\n',
          )
          text = text.replace(
              '                    else f"Independent visible tests failed or timed out: {(visible.stdout + visible.stderr)[-500:]}"\n',
              '                    else (\n'
              '                        "Independent visible tests failed or timed out: "\n'
              '                        f"{(visible.stdout + visible.stderr)[-500:]}"\n'
              '                    )\n',
          )
          text = text.replace(
              '            forced_rationale="The evaluation harness failed; this outcome says nothing about the submitted patch.",\n',
              '            forced_rationale=(\n'
              '                "The evaluation harness failed; this outcome says nothing "\n'
              '                "about the submitted patch."\n'
              '            ),\n',
          )
          evaluator.write_text(text, encoding='utf-8')

          bundle = Path('app/intake/bundle.py')
          text = bundle.read_text(encoding='utf-8')
          text = text.replace('import os\n', '')
          text = text.replace(
              'from app.intake.schema_subset import SchemaViolation, schema_by_title, validate\n',
              'from app.intake.schema_subset import schema_by_title, validate\n',
          )
          bundle.write_text(text, encoding='utf-8')
          PY
          ruff format app/evaluator/experiment_one.py app/intake/bundle.py
          ruff check app/evaluator/experiment_one.py app/intake/bundle.py

      - name: Commit fixed files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/evaluator/experiment_one.py app/intake/bundle.py
          git commit -m 'style: fix Experiment 1 lint'
          git push origin HEAD:agent/experiment-1-public-evaluation
