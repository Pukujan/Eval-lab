name: CKFF connectivity

on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact CKFF model alias to test
        required: true
        default: gpt-5.6-luna
        type: string

permissions:
  contents: read

env:
  # The evaluation service, never production. Public configuration, not a secret.
  EXPECTED_BASE_URL: https://litellm-eval-production.up.railway.app

jobs:
  smoke:
    name: One bounded CKFF request
    runs-on: [self-hosted, gravebuster, Eval-lab]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # No fallback URL. A default that silently pointed at the production
      # gateway would produce a green connectivity check against a service whose
      # retries, pooled routes and parameter-dropping make its numbers
      # unusable as evidence — the failure mode being that it *works*.
      - name: Verify the secret and the evaluation endpoint are configured
        shell: bash
        env:
          CKFF_API_KEY: ${{ secrets.CKFF_API_KEY }}
          CKFF_BASE_URL: ${{ vars.CKFF_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$CKFF_API_KEY" || {
            echo "Missing repository secret CKFF_API_KEY" >&2
            exit 1
          }
          test -n "$CKFF_BASE_URL" || {
            echo "Missing repository variable CKFF_BASE_URL." >&2
            echo "Set it to $EXPECTED_BASE_URL" >&2
            exit 1
          }
          if [ "$CKFF_BASE_URL" != "$EXPECTED_BASE_URL" ]; then
            echo "CKFF_BASE_URL is $CKFF_BASE_URL" >&2
            echo "This workflow only targets the evaluation service:" >&2
            echo "  $EXPECTED_BASE_URL" >&2
            echo "The production gateway is not evidence-valid for Task 2B." >&2
            exit 1
          fi
          echo "endpoint: $CKFF_BASE_URL"

      - name: Test CKFF gateway
        uses: ./.github/actions/ckff-smoke
        with:
          base-url: ${{ vars.CKFF_BASE_URL }}
          api-key: ${{ secrets.CKFF_API_KEY }}
          model: ${{ inputs.model }}
