name: CKFF connectivity

on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact CKFF model alias to test
        required: true
        default: gpt-5.6-luna
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: One bounded CKFF request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Verify repository secret exists
        shell: bash
        env:
          CKFF_API_KEY: ${{ secrets.CKFF_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CKFF_API_KEY" || {
            echo "Missing repository secret CKFF_API_KEY" >&2
            exit 1
          }

      - name: Test CKFF gateway
        uses: ./.github/actions/ckff-smoke
        with:
          base-url: ${{ vars.CKFF_BASE_URL || 'https://litellm-production-8656.up.railway.app' }}
          api-key: ${{ secrets.CKFF_API_KEY }}
          model: ${{ inputs.model }}
