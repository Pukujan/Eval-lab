name: Format Experiment 1 branch

on:
  push:
    branches:
      - agent/experiment-1-public-evaluation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experiment-1-public-evaluation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned formatter
        run: python -m pip install ruff==0.14.14

      - name: Format E5 files
        run: >-
          ruff format
          app/evaluator/experiment_one.py
          app/intake/bundle.py
          app/intake/schema_subset.py
          tests/unit/test_experiment_one_evaluator.py

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/evaluator/experiment_one.py app/intake/bundle.py app/intake/schema_subset.py tests/unit/test_experiment_one_evaluator.py
          git commit -m 'style: format Experiment 1 public evaluation'
          git push origin HEAD:agent/experiment-1-public-evaluation
