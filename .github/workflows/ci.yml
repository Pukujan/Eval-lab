name: CI

# CI must never require a paid model API key. Every job below runs entirely on
# the deterministic mock path.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PROMPTFOO_VERSION: "0.121.19"
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"
  # Local-only placeholder; the mock provider ignores it. Not a secret.
  LITELLM_MASTER_KEY: sk-local-mock-only

permissions:
  contents: read

jobs:
  static:
    name: Format, lint, types, security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check app evals scripts tests

      - name: Lint
        run: ruff check app evals scripts tests

      - name: Type check
        run: mypy app

      - name: Security scan (application code)
        run: bandit -q -r app -c pyproject.toml

      - name: Dependency audit
        run: |
          pip install pip-audit==2.10.1
          # Advisory: a new CVE in a transitive dependency must not silently
          # break every branch. Reviewed from the uploaded report instead.
          pip-audit --strict --progress-spinner off || echo "::warning::pip-audit reported findings"

  test:
    name: Unit, property and acceptance tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install -e ".[dev]"

      - name: Confirm no model credentials are present
        run: |
          if env | grep -Eq '^(OPENAI|ANTHROPIC|GOOGLE|MISTRAL)_API_KEY='; then
            echo "CI must not hold model API keys"; exit 1
          fi
          echo "no provider credentials present"

      - name: Unit and property tests
        run: pytest tests/unit tests/property -q --junit-xml=reports/unit.xml

      - name: Acceptance tests
        run: pytest tests/acceptance -q --junit-xml=reports/acceptance.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

  integration:
    name: Containers, integration tests and mock evaluations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install -e ".[dev]"
          npm install -g promptfoo@${{ env.PROMPTFOO_VERSION }}

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start required containers
        run: docker compose up -d --wait temporal phoenix litellm

      - name: Verify every service is healthy
        run: python scripts/health.py

      - name: Integration tests
        env:
          TEMPORAL_ADDRESS: localhost:7233
          LITELLM_BASE_URL: http://localhost:4000
          PHOENIX_ENDPOINT: http://localhost:6006
        run: pytest tests/integration -q -rs --junit-xml=reports/integration.xml

      - name: Inspect AI evaluation (mock provider)
        env:
          PHOENIX_ENDPOINT: http://localhost:6006
        run: |
          mkdir -p evals/logs
          inspect eval evals/inspect/coding_eval.py \
            --model mockllm/model --log-dir evals/logs --display plain

      - name: Promptfoo evaluation (mock provider)
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/../../../opt/hostedtoolcache/Python/bin/python
        run: |
          mkdir -p evals/reports
          cd evals/promptfoo
          PROMPTFOO_PYTHON="$(which python)" promptfoo eval \
            -c promptfooconfig.yaml --no-cache -o ../reports/promptfoo-report.json

      - name: Walking-skeleton demo
        env:
          TEMPORAL_ADDRESS: localhost:7233
          LITELLM_BASE_URL: http://localhost:4000
          PHOENIX_ENDPOINT: http://localhost:6006
          EXECUTION_MODE: temporal
        run: python scripts/demo.py

      - name: Collect service logs
        if: always()
        run: |
          mkdir -p reports/service-logs
          for service in temporal phoenix litellm; do
            docker compose logs "$service" > "reports/service-logs/$service.log" 2>&1 || true
          done

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-artifacts
          path: |
            evals/logs/
            evals/reports/
            reports/
          retention-days: 14

      - name: Stop containers
        if: always()
        run: docker compose down -v
