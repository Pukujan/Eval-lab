name: CI

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Repository contract
        run: uv run --locked python scripts/check_repo_contract.py

      - name: Canonical workspace policy
        run: uv run --locked python scripts/check_workspace_policy.py --canonical-root "$GITHUB_WORKSPACE"

      - name: Lint
        run: uv run --locked ruff check .

      - name: Formatting (changed Python files)
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="origin/main"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed_python < <(git diff --name-only "$base...HEAD" -- '*.py')
          if ((${#changed_python[@]})); then
            uv run --locked ruff format --check "${changed_python[@]}"
          else
            echo "No changed Python files to format-check."
          fi

      - name: Type check
        run: uv run --locked mypy src/eval_lab

      - name: Unit tests
        run: uv run --locked python -m pytest tests -q

      - name: Chart data export is current (TASK-0059)
        run: uv run --locked python scripts/export_chart_data.py --check

      - name: Archived v0.1.0 release validates (RO-Crate, PROV-O, SHACL)
        run: uv run --locked python scripts/validate_research_artifacts.py --benchmark benchmark/eval-lab-select-v0.1.0

      - name: Build distributions
        run: uv build --out-dir "$RUNNER_TEMP/eval-lab-dist"

  # TASK-0060 phase 2: the live backend under `live/`.  A separate job so the
  # research install above stays unchanged and the two run in parallel: this one
  # needs a database, the other must not.
  live:
    name: live (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: evallab
          POSTGRES_PASSWORD: evallab
          POSTGRES_DB: evallab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evallab -d evallab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The migration and role tests run only when this is set; the rest of the
      # suite is SQLite and needs nothing.
      EVALLAB_LIVE_TEST_DATABASE_URL: postgresql+psycopg://evallab:evallab@localhost:5432/evallab
      # Migrations run as the owning role (the service container's superuser).
      # The API's own default is the read-only role, which could not create a
      # schema; the tests override the URL themselves, so this only affects the
      # `alembic` step below.
      EVALLAB_LIVE_DATABASE_URL: postgresql+psycopg://evallab:evallab@localhost:5432/evallab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked dependencies (research + live)
        run: uv sync --locked --extra dev --extra live

      - name: Lint the live backend
        run: uv run --locked ruff check live

      - name: Formatting (live)
        run: uv run --locked ruff format --check live

      - name: Type check the live backend
        run: uv run --locked mypy live/src/eval_lab_live

      - name: Migrations up and down (Postgres 17)
        run: |
          uv run --locked alembic -c live/alembic.ini upgrade head
          uv run --locked alembic -c live/alembic.ini downgrade base

      # Backfill of every committed run, the paper-match proof, the JSON Schema
      # contract tests, the leakage tests and the role-separation tests.
      - name: Live test suite
        run: uv run --locked python -m pytest live/tests -q

      - name: The live image builds
        run: docker build -f live/docker/Dockerfile -t eval-lab-live:ci .
