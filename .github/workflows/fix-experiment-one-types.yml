name: Finalize Experiment 1 types

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/experiment-1-public-evaluation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experiment-1-public-evaluation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned project tools
        run: python -m pip install -e '.[dev]'

      - name: Apply final type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          evaluator = Path('app/evaluator/experiment_one.py')
          lines = evaluator.read_text(encoding='utf-8').splitlines(keepends=True)
          intake_fixed = False
          patch_fixed = False
          for index, line in enumerate(lines):
              if 'detail = "; ".join(' in line and 'exc.violations' in line:
                  lines[index] = line.replace('detail =', 'intake_detail =', 1)
                  intake_fixed = True
              if line == '        detail = (\n' and index > 0 and 'path_error is None' in lines[index - 1]:
                  lines[index] = '        patch_detail = (\n'
                  patch_fixed = True
          if not intake_fixed:
              raise SystemExit('intake detail line not found')
          if not patch_fixed:
              raise SystemExit('patch detail line not found')
          evaluator.write_text(''.join(lines), encoding='utf-8')

          schema = Path('app/intake/schema_subset.py')
          text = schema.read_text(encoding='utf-8')
          old = 'out.extend(min(attempts, key=len))'
          if old not in text:
              raise SystemExit('schema min line not found')
          schema.write_text(
              text.replace(
                  old,
                  'out.extend(min(attempts, key=lambda found: len(found)))',
                  1,
              ),
              encoding='utf-8',
          )

          diagnostic = Path('docs/E5-TYPE-DIAGNOSTICS.txt')
          if diagnostic.exists():
              diagnostic.unlink()
          PY
          ruff format app/evaluator/experiment_one.py app/intake/schema_subset.py
          ruff check app/evaluator/experiment_one.py app/intake/bundle.py app/intake/schema_subset.py
          mypy app

      - name: Commit green type fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A app/evaluator/experiment_one.py app/intake/schema_subset.py docs/E5-TYPE-DIAGNOSTICS.txt
          git commit -m 'fix: complete Experiment 1 type narrowing'
          git push origin HEAD:agent/experiment-1-public-evaluation
