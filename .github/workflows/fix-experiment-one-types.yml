name: Diagnose final Experiment 1 types

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/experiment-1-public-evaluation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experiment-1-public-evaluation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned project tools
        run: python -m pip install -e '.[dev]'

      - name: Apply exact edits and capture diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          evaluator = Path('app/evaluator/experiment_one.py')
          text = evaluator.read_text(encoding='utf-8')
          text = text.replace(
              '        detail = "; ".join(f"{item.code}@{item.pointer or \'/\'}" for item in exc.violations)[:1000]\n',
              '        intake_detail = "; ".join(\n'
              '            f"{item.code}@{item.pointer or \'/\'}" for item in exc.violations\n'
              '        )[:1000]\n',
              1,
          )
          text = text.replace(
              '    if path_error is None and not permitted:\n'
              '        detail = (\n',
              '    if path_error is None and not permitted:\n'
              '        patch_detail = (\n',
              1,
          )
          evaluator.write_text(text, encoding='utf-8')

          schema = Path('app/intake/schema_subset.py')
          text = schema.read_text(encoding='utf-8')
          text = text.replace(
              '            out.extend(min(attempts, key=len))\n',
              '            out.extend(min(attempts, key=lambda found: len(found)))\n',
              1,
          )
          schema.write_text(text, encoding='utf-8')
          PY
          ruff format app/evaluator/experiment_one.py app/intake/schema_subset.py
          {
            echo '## Ruff'
            ruff check app/evaluator/experiment_one.py app/intake/bundle.py app/intake/schema_subset.py || true
            echo
            echo '## Mypy'
            mypy app || true
          } > docs/E5-FINAL-DIAGNOSTICS.txt 2>&1

      - name: Commit candidate edits and diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/evaluator/experiment_one.py app/intake/schema_subset.py docs/E5-FINAL-DIAGNOSTICS.txt
          git commit -m 'diagnostics: capture final Experiment 1 type state'
          git push origin HEAD:agent/experiment-1-public-evaluation
