name: Finalize Experiment 1 types

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/experiment-1-public-evaluation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experiment-1-public-evaluation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned project tools
        run: python -m pip install -e '.[dev]'

      - name: Replace the final ambiguous key function
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('app/intake/schema_subset.py')
          text = schema.read_text(encoding='utf-8')
          anchor = '''def _validate(\n'''
          helper = '''def _violation_count(found: list[SchemaViolation]) -> int:\n    return len(found)\n\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('validator anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
          old = 'min(attempts, key=lambda found: len(found))'
          if old not in text:
              raise SystemExit('ambiguous min expression not found')
          text = text.replace(old, 'min(attempts, key=_violation_count)', 1)
          schema.write_text(text, encoding='utf-8')

          diagnostic = Path('docs/E5-FINAL-DIAGNOSTICS.txt')
          if diagnostic.exists():
              diagnostic.unlink()
          PY
          ruff format app/intake/schema_subset.py
          ruff check app/evaluator/experiment_one.py app/intake/bundle.py app/intake/schema_subset.py
          mypy app

      - name: Commit green source and remove diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A app/intake/schema_subset.py docs/E5-FINAL-DIAGNOSTICS.txt
          git commit -m 'fix: complete Experiment 1 type checks'
          git push origin HEAD:agent/experiment-1-public-evaluation
