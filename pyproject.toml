[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-lab"
version = "0.1.0"
description = "Objective-grounded judge evaluation and calibration lab"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "datasets>=3.0",
  "inspect-ai>=0.3"
]

[project.optional-dependencies]
local = [
  "transformers>=4.51",
  "torch>=2.4",
  "peft>=0.13",
  "trl>=0.11"
]
figures = [
  "matplotlib>=3.9"
]
# TASK-0060 phase 2: the live app backend under `live/`.  Optional on purpose:
# the research install (`uv sync --extra dev`) stays unchanged and never pulls
# a web stack or a database driver.
live = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  # The loader re-runs `scripts/export_chart_data.py`, which reads the arm
  # metadata YAML; keep the dependency explicit rather than transitive.
  "pyyaml>=6.0"
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.15",
  "rdflib>=7.0",
  "pyshacl>=0.26",
  "jsonschema>=4.23"
]

[tool.setuptools.packages.find]
where = ["src", "live/src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src/eval_lab"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
warn_return_any = true
