[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-lab"
version = "0.1.0"
description = "Objective-grounded judge evaluation and calibration lab"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "inspect-ai>=0.3"
]

[project.optional-dependencies]
local = [
  "transformers>=4.51",
  "torch>=2.4",
  "peft>=0.13",
  "trl>=0.11"
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
