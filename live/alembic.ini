# Alembic configuration for the live read model.
#
# The URL is *not* set here: ``migrations/env.py`` reads it from
# ``EVALLAB_LIVE_DATABASE_URL`` (via ``eval_lab_live.config``), so migrations use
# the owner/ingest role and the API uses the read-only role, from one setting.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# Revisions are hand-reviewed; keep the timestamps stable in diffs.
timezone = UTC
# Every migration that touches DDL runs inside a transaction.  The role/grant
# revision opts out per-statement where Postgres requires it.
version_path_separator = os
version_table_schema = live
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
